<div *ngIf="cartItems.length > 0; else emptyCart" class="container mt-4">
  <div class="row" *ngFor="let item of cartItems">
    <div class="col-md-3">
      <a [routerLink]="['/product', item.id]">
        <img [src]="item.image" [alt]="item.title" class="img-fluid rounded" />
      </a>
    </div>

    <div class="col-md-6">
      <h5>{{ item.title }}</h5>
      <p>{{ item.subtitle }}</p>
      <p>{{ item.material }}</p>
      <p>⭐ {{ item.rating }}</p>
      <p class="text-muted">Price: ${{ item.price }}</p>
      <div class="d-flex align-items-center">
        <label class="me-2">Quantity:</label>
        <select [(ngModel)]="item.quantity" class="form-select w-auto" (change)="calculateTotal()">
          <option *ngFor="let qty of [1,2,3,4,5]" [value]="qty">{{ qty }}</option>
        </select>
      </div>
    </div>

    <div class="col-md-3 text-end">
      <button class="btn btn-outline-danger mb-2" (click)="removeFromCart(item.id)">🗑 Remove</button>
    </div>

    <hr class="my-3"/>
  </div>

  <div class="row mt-4">
    <div class="col text-end">
      <h4>Total: <span class="text-success">${{ totalAmount }}</span></h4>
      <button class="btn btn-primary mt-2" (click)="goToBilling($event)">Proceed to Billing</button>
    </div>
  </div>
</div>

<!-- Empty Cart Message -->
<ng-template #emptyCart>
  <div class="alert alert-info text-center mt-5">
    <h5>Your cart is empty 🛒</h5>
  </div>
</ng-template>
