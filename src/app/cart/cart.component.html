   <div class="container my-5">
    <h2 class="mb-4 text-center text-primary">🛒 Your Shopping Cart</h2>
  
    <div *ngIf="cartItems.length > 0; else emptyCart">
      <div *ngFor="let item of cartItems" class="card shadow-sm mb-3 p-3">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h5 class="mb-1">{{ item.title }}</h5>
            <p class="mb-1 text-muted">Price: ${{ item.price }}</p>
  
            <div class="d-flex align-items-center mb-2">
              <label class="me-2">Quantity:</label>
              <select [(ngModel)]="item.quantity" class="form-select w-auto" (change)="calculateCartTotal()">
                <option *ngFor="let qty of [1,2,3,4,5]" [value]="qty">{{ qty }}</option>
              </select>
            </div>
  
            <p class="fw-bold">Subtotal: ${{ item.price * (item.quantity || 1) }}</p>
          </div>
  
          <button class="btn btn-outline-danger btn-sm" (click)="removeFromCart(item.id)">🗑 Remove</button>
        </div>
      </div>
  
      <hr />
  
      <div class="d-flex justify-content-between align-items-center">
        <h4>Total: <span class="text-success">${{ totalAmount }}</span></h4>
        <button class="btn btn-primary" (click)="goToBilling($event)">Proceed to Billing</button>
      </div>
    </div>
  
    <ng-template #emptyCart>
      <div class="alert alert-info text-center">
        <h5>Your cart is empty 🛒</h5>
      </div>
    </ng-template>
  </div>
