<!-- ✅ Correct: -->
<div *ngFor="let item of cartItems">
  <a [routerLink]="['/product', item.id]">
    <img [src]="item.image" [alt]="item.title">
  </a>
  <p>{{ item.title }}</p>
  <p>{{ item.subtitle }}</p>
  <p>{{ item.material }}</p>
  <p>⭐ {{ item.rating }}</p>
  <p class="mb-1 text-muted">Price: ${{ item.price }}</p>
  <div class="d-flex align-items-center mb-2">
    <label class="me-2">Quantity:</label>
    <select [(ngModel)]="item.quantity" class="form-select w-auto" (change)="calculateCartTotal()">
      <option *ngFor="let qty of [1,2,3,4,5]" [value]="qty">{{ qty }}</option>
    </select>
  </div>
  <div class="col-2 d-flex flex-column">
    <div class="text-end mb-5"> <button class="btn btn-outline-danger" (click)="removeFromCart(item.id)">🗑
        Remove</button></div>
    <h4 class="mt-5">Total : <span class="text-success btn btn-outline-dark">${{ totalAmount }}</span></h4>
  </div>
  <div class="d-flex justify-content-between align-items-center">
    <button class="btn btn-primary" (click)="goToBilling($event)">Proceed to Billing</button>
  </div>
</div>
<ng-template #emptyCart>
  <div class="alert alert-info text-center">
    <h5>Your cart is empty 🛒</h5>
  </div>
</ng-template>
