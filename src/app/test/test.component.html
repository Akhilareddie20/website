<div class="container mt-4">
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let product of products">
      <div class="card h-100 shadow-sm">
        <img [src]="product.image" class="card-img-top" alt="{{ product.title }}" onError="this.src='https://via.placeholder.com/300x200?text=Image+Not+Found'">
        <div class="card-body">
          <h5 class="card-title">{{ product.title }}</h5>
          <h6 class="card-subtitle mb-2 text-muted" *ngIf="product.subtitle">{{ product.subtitle }}</h6>
          <p class="card-text" *ngIf="product.material"><strong>Material:</strong> {{ product.material }}</p>
          <p class="card-text"><strong>Rating:</strong> {{ product.rating || 'N/A' }}</p>
          <p class="card-text"><strong>Quantity:</strong> {{ product.quantity }}</p>
          <p class="card-text"><strong>Price:</strong> ₹{{ product.price }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
